replicaCount: 1

image:
  repository: halltabak/digital-id-verifier
  pullPolicy: Always
  # tag defaults to .Chart.AppVersion when empty
  tag: "latest"

imagePullSecrets:
  - name: registry-1

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 5001
  targetPort: 5001

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: digital-id-verifier.b-cdn.net
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Example:
  # tls:
  #   - secretName: approval-raucherpause-tls
  #     hosts:
  #       - approval.raucherpause.de

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 20
  periodSeconds: 20
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}
